name: Sync Android port with upstream

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: android-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Merge latest SolidCraft release and build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out Android port
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK platform and NDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found under $SDK_ROOT/cmdline-tools"
            find "$SDK_ROOT" -maxdepth 4 -type f -name sdkmanager -print || true
            exit 1
          fi
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/29.0.14206865" >> "$GITHUB_ENV"

          # sdkmanager closes stdin after reading all licenses. The 'yes'
          # process then receives SIGPIPE; disable pipefail for this pipeline
          # only so the step reports sdkmanager's exit status, not yes's.
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses
          set -o pipefail

          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-36" "ndk;29.0.14206865"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,wasm32-unknown-unknown

      # rust-toolchain.toml pins a version other than stable: give that toolchain the targets too.
      - name: Add Android target to the pinned toolchain
        run: rustup target add aarch64-linux-android wasm32-unknown-unknown

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Configure Git and upstream remote
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/tangency-labs/solidcraft.git
          git fetch origin main

      - name: Synchronize, run port checks and build APK
        run: scripts/android-sync.sh --latest

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SolidCraft-Android-debug
          path: apps/solidcraft-android/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Open pull request with the synchronized port
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_BRANCH: sync/upstream-${{ github.run_id }}
        run: |
          if git diff --quiet origin/main...HEAD; then
            echo "The Android port is already up to date; no pull request is needed."
            exit 0
          fi
          git push origin "HEAD:refs/heads/$RUN_BRANCH"
          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$RUN_BRANCH" \
            --title "Sync Android port with latest SolidCraft release" \
            --body "Automated upstream release sync. The Android port checks and debug APK build completed in GitHub Actions. Please review the merge and test the APK on a device before merging."
